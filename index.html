:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f7f7fc;
  color: #202039;
  --muted: #5e6076;
  --accent: #6245ca;
  --accent-dark: #5435bb;
  --line: #e9e7f1;
  --board-strong: #777092;
  --soft: #f7f6fb;
  --card-shadow: 0 3px 18px #28205107;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid #8064ee; outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, p { margin: 0; }

.shell { width: min(1088px, calc(100% - 56px)); margin-inline: auto; }
.site-header { background: #fff; border-bottom: 1px solid var(--line); }
.header-inner { height: 70px; display: flex; align-items: center; justify-content: space-between; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 1.19rem; font-weight: 750; letter-spacing: -.025em; }
.brand-mark { flex: none; width: 37px; height: 37px; border-radius: 11px; background: linear-gradient(145deg, #8c6df3, #5b3bc5); padding: 9px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; }
.brand-mark i { border-radius: 2px; background: #fff; }
.brand-mark i:nth-child(2) { opacity: .62; }
.brand-mark i:nth-child(3) { opacity: .48; }
.button { min-height: 40px; border: 1px solid #e3dff0; background: #fff; border-radius: 10px; padding: 8px 13px; font-size: .875rem; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
.button:hover { background: #f5f1ff; border-color: #cfbff9; }
.share { color: var(--accent-dark); }
.main { padding-top: 25px; padding-bottom: 24px; }
.intro {
  isolation: isolate; position: relative; overflow: hidden; display: flex; align-items: center; min-height: 146px; padding: 23px 34px;
  border: 1px solid #e7ddfd; border-radius: 20px;
  background: radial-gradient(ellipse at 82% 5%, #e0d2ff 0%, transparent 60%), linear-gradient(111deg, #efebff, #f3edff 56%, #e9dcfd);
}
.intro-copy { position: relative; z-index: 1; }
.intro h1 { font-size: clamp(1.7rem, 4vw, 2.35rem); line-height: 1.18; font-weight: 790; letter-spacing: -.055em; color: #29204d; }
.intro p { color: #51466e; font-size: 1rem; line-height: 1.55; margin-top: 10px; }
.intro-art {
  position: absolute; display: grid; grid-template-columns: repeat(5, 50px); gap: 7px; top: -31px; right: 50px;
  transform: rotate(-13deg); color: #6048ae; opacity: .9; pointer-events: none;
}
.intro-art span { display: grid; place-items: center; height: 50px; border: 1px solid #cebef8; border-radius: 9px; background: #ebe2ff75; font-size: 1.6rem; font-weight: 720; }
.intro-art span:nth-child(2), .intro-art span:nth-child(6), .intro-art span:nth-child(13) { background: #d8c7fc; }
.intro-art span:nth-child(5), .intro-art span:nth-child(9), .intro-art span:nth-child(15), .intro-art span:nth-child(17) { background: #cbb5ff; }

.workspace { display: grid; grid-template-columns: minmax(0, 1.51fr) minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 18px 22px; align-items: start; margin-top: 21px; }
.surface { border: 1px solid var(--line); background: #fff; border-radius: 18px; box-shadow: var(--card-shadow); }
.game { grid-column: 1; grid-row: 1 / span 2; padding: 22px 26px 17px; }
.game-header, .game-meta { margin-inline: auto; width: min(100%, 464px); display: flex; align-items: center; justify-content: space-between; }
.game-header { margin-bottom: 16px; }
.game-header > div:first-child { display: flex; align-items: center; gap: 11px; }
.game-header h2 { font-size: 1.28rem; line-height: 1.2; font-weight: 760; letter-spacing: -.04em; }
.difficulty-pill { color: #5637ac; border-radius: 7px; background: #eee6ff; padding: 5px 8px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
.timer { display: flex; align-items: center; gap: 7px; min-width: 78px; min-height: 34px; justify-content: center; border-radius: 8px; background: var(--soft); color: #52526a; padding: 5px 9px; }
.timer time { font-size: .95rem; font-variant-numeric: tabular-nums; font-weight: 680; }
.board { display: grid; grid-template-rows: repeat(9, minmax(0, 1fr)); aspect-ratio: 1; width: min(100%, 464px); margin-inline: auto; border: 2px solid var(--board-strong); border-radius: 12px; overflow: hidden; background: #fff; }
.board-row { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); min-height: 0; }
.cell { position: relative; display: grid; place-items: center; min-width: 0; padding: 0; background: #fff; border: 0; color: #5736c1; font-size: clamp(1.17rem, 3vw, 1.68rem); font-weight: 700; line-height: 1; }
.cell:not(:last-child) { border-right: 1px solid #e1dfed; }
.board-row:not(:last-child) .cell { border-bottom: 1px solid #e1dfed; }
.cell:nth-child(3n):not(:last-child) { border-right: 2px solid var(--board-strong); }
.board-row:nth-child(3n):not(:last-child) .cell { border-bottom: 2px solid var(--board-strong); }
.cell.given { color: #292941; }
.cell.related { background: #f2eeff; }
.cell.match { background: #e8dfff; }
.cell.conflict { color: #af284e; background: #fff1f4; }
.cell.selected { background: #dcd0ff; box-shadow: inset 0 0 0 2px #8465e3; }
.cell.conflict.selected { background: #fce0e8; }
.cell:focus-visible { outline-offset: -3px; z-index: 1; }
@media (hover: hover) {
  .cell:hover:not(.selected):not(.conflict) { background: #f1ebff; }
}
.cell-notes { width: 87%; height: 87%; display: grid; grid-template: repeat(3, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr)); font-size: clamp(.59rem, 1.35vw, .75rem); font-weight: 650; color: #585176; }
.cell-notes span { display: grid; place-items: center; }
.game-meta { color: var(--muted); font-size: .82rem; gap: 10px; margin-top: 12px; min-height: 25px; }
.game-meta-actions { display: flex; align-items: center; gap: 14px; }
#jump-to-levels { display: none; }
.save-status { display: inline-flex; align-items: center; gap: 7px; }
.save-dot { display: inline-block; width: 7px; height: 7px; background: #378e71; border-radius: 50%; }
.save-status[data-failed="true"] .save-dot { background: #be5f25; }

.tools { grid-column: 2; grid-row: 1; padding: 19px 20px 15px; }
.levels { grid-column: 2; grid-row: 2; padding: 19px 20px 16px; }
.section-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-head h2 { font-size: 1.08rem; font-weight: 760; line-height: 1.3; }
.text-button { border: 0; background: transparent; padding: 4px 1px; color: var(--accent-dark); white-space: nowrap; font-weight: 650; font-size: .82rem; }
.text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
.help { display: flex; align-items: center; gap: 5px; }
.question { width: 15px; height: 15px; display: grid; place-items: center; font-size: .67rem; border: 1px solid currentColor; border-radius: 50%; }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.action {
  padding: 7px 0; display: grid; place-items: center; min-height: 57px; gap: 4px; position: relative;
  border: 1px solid #eeebf7; border-radius: 10px; background: var(--soft); min-width: 0; font-size: .83rem; font-weight: 660;
}
.action .icon { color: var(--accent); }
.action:hover:not(:disabled), .level-button:hover { background: #f0eaff; border-color: #d5c9fa; }
.action:disabled { color: #73758a; }
.action:disabled .icon { color: #75758a; }
.action[aria-pressed="true"] { border-color: #b59cf6; background: #ede4ff; color: var(--accent-dark); }
.hint-count { position: absolute; top: 5px; right: 5px; color: #5a3cb5; background: #e9e0ff; border-radius: 10px; min-width: 16px; line-height: 16px; font-size: .64rem; }
.pad { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; margin-top: 13px; }
.pad-key { border: 1px solid #e5ddfb; border-radius: 8px; padding: 0; min-width: 0; min-height: 43px; background: #f4efff; color: #5839b3; font-size: 1.15rem; font-weight: 720; }
.pad-key:hover:not(:disabled) { background: #e8dcff; border-color: #baa5f1; }
.pad-key:disabled { opacity: .61; }
.keyboard-help, .mode-help { margin-top: 11px; color: var(--muted); font-size: .82rem; line-height: 1.45; }
.mode-help { color: #5435bb; }
.tools:has(.mode-help:not([hidden])) .keyboard-help { display: none; }
.tier-progress { font-size: .83rem; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
.difficulty-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 4px; background: #f3f1f8; border-radius: 10px; }
.difficulty-tab { background: transparent; border: 1px solid transparent; border-radius: 7px; color: #56556b; padding: 7px 2px; font-size: .875rem; font-weight: 650; }
.difficulty-tab:hover { color: var(--accent-dark); background: #f9f6ff; }
.difficulty-tab[aria-pressed="true"] { background: #fff; border-color: #ebe2fc; box-shadow: 0 1px 3px #271d5010; color: var(--accent-dark); }
.level-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-top: 12px; }
.level-button { position: relative; min-height: 43px; border: 1px solid #e9e6f0; border-radius: 9px; background: #fbfafc; color: #3f3c57; font-size: .94rem; font-weight: 720; font-variant-numeric: tabular-nums; }
.level-button[aria-current="true"] { background: #6546cd; border-color: #6546cd; color: #fff; }
.level-status { position: absolute; right: 5px; top: 5px; border-radius: 50%; width: 6px; height: 6px; background: #b08aef; }
.level-status.done { width: auto; height: auto; background: transparent; font-size: .75rem; line-height: 1; top: 3px; color: #20785c; }
.level-button[aria-current="true"] .level-status { color: #fff; background: #d6c5ff; }
.level-button[aria-current="true"] .level-status.done { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; color: var(--muted); font-size: .81rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; background: #6546cd; }
.legend .legend-started { background: #b08aef; }
.legend .legend-done { background: #378e71; }
.local-info { display: flex; color: #62637a; gap: 7px; align-items: center; justify-content: center; margin-top: 19px; font-size: .83rem; text-align: center; }

.icon { display: inline-block; position: relative; width: 17px; height: 17px; flex: none; line-height: 1; }
.icon::before, .icon::after { content: ""; position: absolute; display: block; }
.icon-clock::before { inset: 1px; border: 1.6px solid currentColor; border-radius: 50%; }
.icon-clock::after { width: 4px; height: 5px; left: 8px; top: 4px; border-left: 1.5px solid; border-bottom: 1.5px solid; }
.icon-link::before, .icon-link::after { width: 10px; height: 6px; border: 1.6px solid; border-radius: 5px; transform: rotate(-44deg); }
.icon-link::before { top: 3px; right: 0; }
.icon-link::after { bottom: 3px; left: 0; }
.icon-undo::before { width: 13px; height: 9px; border: 1.7px solid; border-left: 0; border-right-style: solid; border-radius: 0 6px 6px 0; left: 3px; top: 5px; }
.icon-undo::after { width: 7px; height: 7px; border-left: 1.7px solid; border-bottom: 1.7px solid; transform: rotate(45deg); left: 2px; top: 2px; }
.icon-erase::before { width: 12px; height: 10px; border: 1.6px solid; border-radius: 2px; transform: rotate(-44deg); left: 3px; top: 3px; }
.icon-erase::after { width: 8px; border-top: 1.6px solid; transform: rotate(46deg); left: 5px; top: 8px; }
.icon-pencil::before { width: 14px; height: 5px; border: 1.6px solid; border-radius: 3px 1px 1px 3px; transform: rotate(-47deg); left: 2px; top: 6px; }
.icon-pencil::after { width: 4px; height: 4px; border: 1.5px solid; border-right: 0; border-top: 0; transform: rotate(-4deg); left: 2px; bottom: 2px; }
.icon-bulb::before { width: 11px; height: 11px; border: 1.6px solid; border-radius: 8px 8px 5px 5px; left: 3px; }
.icon-bulb::after { width: 6px; height: 4px; border-top: 1.5px solid; border-bottom: 1.5px solid; left: 5.5px; bottom: 2px; }
.icon-device::before { inset: 2px 4px; border: 1.4px solid; border-radius: 2px; }
.icon-device::after { width: 3px; border-top: 1px solid; left: 7px; bottom: 4px; }

.notice { display: none; position: fixed; z-index: 3; bottom: max(22px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #29223e; color: #fff; border-radius: 11px; padding: 10px 14px; max-width: calc(100% - 26px); width: max-content; text-align: center; font-size: .875rem; box-shadow: 0 5px 20px #1b14333b; }
.notice:not(:empty) { display: block; }
dialog { border: 1px solid var(--line); border-radius: 17px; padding: 0; color: inherit; width: min(420px, calc(100% - 32px)); box-shadow: 0 16px 55px #20174235; }
dialog::backdrop { background: #211a3b72; }
.dialog-body { padding: 24px; }
.dialog-body h2 { font-size: 1.3rem; margin-bottom: 11px; }
.dialog-body p, .dialog-body li { color: #51536a; line-height: 1.6; }
.dialog-body ul { padding-left: 20px; margin: 10px 0 0; }
.dialog-body input { width: 100%; margin-top: 10px; border-radius: 7px; border: 1px solid var(--line); padding: 8px; font: inherit; }
.save-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.save-preference { display: grid; gap: 8px; margin: 12px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.save-preference label { display: flex; align-items: center; gap: 7px; font-size: .875rem; }
.save-preference input { width: auto; margin: 0; accent-color: var(--accent); }
.cloud-button { color: var(--accent-dark); }
.cloud-button[data-attention="true"] { border-color: #b07b42; color: #82551e; }
.auth-form { display: grid; gap: 11px; margin-top: 14px; }
.auth-form label { display: grid; gap: 5px; color: #45465d; font-size: .875rem; font-weight: 650; }
.auth-form input { margin: 0; }
.auth-form .auth-migrate { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.auth-form .auth-migrate input { width: auto; accent-color: var(--accent); }
.auth-form .auth-error { min-height: 1.45em; color: #a12549; font-size: .84rem; }
.auth-form .auth-error[data-pending] { color: #51536a; }
.auth-form .auth-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.primary, .primary:hover { background: #6546cd; color: #fff; border-color: #6546cd; }
.primary:hover { background: #5334b8; }

@media (max-width: 800px) {
  .shell { width: min(512px, calc(100% - 30px)); }
  .header-inner { height: 57px; }
  .main { padding-top: 14px; }
  .intro { min-height: 97px; padding: 15px 15px; border-radius: 14px; }
  .intro h1 { font-size: 1.64rem; }
  .intro p { font-size: .88rem; margin-top: 5px; }
  .intro-art { right: -68px; top: -31px; transform: rotate(-13deg) scale(.7); opacity: .34; }
  .workspace { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; align-items: stretch; }
  .game, .tools, .levels { padding: 13px; border-radius: 14px; }
  .game-header { margin-bottom: 10px; }
  .game-meta { margin-top: 7px; }
  #jump-to-levels { display: inline-block; }
  .section-head { margin-bottom: 9px; }
  .action { min-height: 48px; gap: 3px; }
  .pad { margin-top: 9px; }
  .pad-key { min-height: 40px; }
  .keyboard-help, .mode-help { margin-top: 7px; }
}
@media (pointer: coarse) {
  .keyboard-help { display: none; }
}
@media (max-width: 385px) {
  .shell { width: calc(100% - 20px); }
  .brand { font-size: 1rem; gap: 7px; }
  .brand-mark { width: 31px; height: 31px; padding: 7px; }
  .header-actions { gap: 5px; }
  .header-actions .button { padding-inline: 6px; }
  .header-actions .icon { display: none; }
  .header-actions .share span:last-child { font-size: 0; }
  .header-actions .share span:last-child::after { content: "分享"; font-size: .875rem; }
  .game, .tools, .levels { padding-inline: 9px; }
  .pad { gap: 3px; }
}

<body>
  <header class="site-header">
    <div class="shell header-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>数独练习室</div>
      <div class="header-actions">
        <button class="button" id="manage-saves" type="button">存档管理</button>
        <button class="button cloud-button" id="cloud-account" type="button" hidden>云存档</button>
        <button class="button share" id="share" type="button"><span class="icon icon-link" aria-hidden="true"></span><span>分享游戏</span></button>
      </div>
    </div>
  </header>
  <main class="shell main">
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <h1 id="page-title">今天，解一局数独</h1>
        <p>四种难度，48 道题。随时回来，继续解题。</p>
      </div>
      <div class="intro-art" aria-hidden="true">
        <span></span><span>7</span><span></span><span></span><span>1</span>
        <span>2</span><span></span><span></span><span>8</span><span></span>
        <span></span><span></span><span>6</span><span></span><span>3</span>
        <span></span><span>9</span><span></span><span></span><span></span>
      </div>
    </section>

    <div class="workspace">
      <section class="surface game" aria-labelledby="game-title">
        <div class="game-header">
          <div>
            <span class="difficulty-pill" id="difficulty-pill">简单</span>
            <h2 id="game-title">第 01 关</h2>
          </div>
          <div class="timer" aria-label="本关用时">
            <span class="icon icon-clock" aria-hidden="true"></span><time id="timer">00:00</time>
          </div>
        </div>
        <div id="board" class="board" role="grid" aria-label="九乘九数独棋盘" aria-describedby="keyboard-help"></div>
        <div class="game-meta">
          <span id="save-status" class="save-status"><span class="save-dot"></span><span id="save-label">进度自动保存</span></span>
          <div class="game-meta-actions"><button id="jump-to-levels" class="text-button" type="button">选关</button><button id="restart" class="text-button" type="button">重开本关</button></div>
        </div>
      </section>

      <section class="surface tools" aria-labelledby="tools-title">
        <div class="section-head">
          <h2 id="tools-title">解题工具</h2>
          <button id="help" class="text-button help" type="button">玩法说明 <span class="question" aria-hidden="true">?</span></button>
        </div>
        <div class="actions">
          <button id="undo" class="action" type="button"><span aria-hidden="true" class="icon icon-undo"></span>撤销</button>
          <button id="erase" class="action" type="button"><span aria-hidden="true" class="icon icon-erase"></span>擦除</button>
          <button id="notes" class="action" type="button" aria-pressed="false"><span aria-hidden="true" class="icon icon-pencil"></span>笔记</button>
          <button id="hint" class="action" type="button"><span aria-hidden="true" class="icon icon-bulb"></span>提示<span class="hint-count" id="hint-count"></span></button>
        </div>
        <div class="pad" id="pad" role="group" aria-label="数字键盘"></div>
        <p class="keyboard-help" id="keyboard-help">方向键选格 · 1–9 输入 · N 切换笔记</p>
        <p class="mode-help" id="mode-help" hidden>笔记模式已开启，再按同一数字可删除笔记。</p>
      </section>

      <section class="surface levels" aria-labelledby="levels-title">
        <div class="section-head">
          <h2 id="levels-title">选择关卡</h2>
          <span class="tier-progress" id="tier-progress"></span>
        </div>
        <div class="difficulty-tabs" id="difficulty-tabs" role="group" aria-label="选择难度"></div>
        <div class="level-grid" id="level-grid" aria-label="关卡列表"></div>
        <div class="legend" aria-label="关卡状态图例">
          <span><i class="legend-current"></i>当前</span>
          <span><i class="legend-started"></i>有存档</span>
          <span><i class="legend-done"></i>已通关</span>
        </div>
      </section>
    </div>
    <p class="local-info"><span class="icon icon-device" aria-hidden="true"></span>本机自动保存。换设备时可通过存档管理转移进度。</p>
  </main>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <input id="save-file" type="file" accept=".json,application/json" hidden>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-body">
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
      <div class="dialog-actions">
        <button id="dialog-close" class="button" type="button">关闭</button>
        <button id="dialog-confirm" class="button primary" type="button" hidden></button>
      </div>
    </div>
  </dialog>

<script>
'use strict';

const difficultyNames = { easy: '简单', medium: '普通', hard: '困难', expert: '专家' };
const difficulties = Object.keys(difficultyNames);
const levels = window.SUDOKU_PUZZLES;
const digits = Array.from({ length: 9 }, (_, i) => i + 1);
const squares = Array.from({ length: 81 }, (_, i) => i);
const bit = n => 1 << (n - 1);
const rowOf = i => Math.floor(i / 9);
const colOf = i => i % 9;
const boxOf = i => Math.floor(rowOf(i) / 3) * 3 + Math.floor(colOf(i) / 3);
const related = squares.map(i => squares.filter(j => i !== j && (rowOf(i) === rowOf(j) || colOf(i) === colOf(j) || boxOf(i) === boxOf(j))));
const prefix = 'sudoku-studio:v1:';
const levelKey = (tier, level) => prefix + tier + ':' + level;
const activeKey = prefix + 'active';
const byId = id => document.getElementById(id);
const board = byId('board');
const dialog = byId('dialog');
const pad = byId('pad');
const levelGrid = byId('level-grid');
const difficultyTabs = byId('difficulty-tabs');
const timer = byId('timer');

let statusTimeout;
let storageFailed = false;
let dialogAction = null;
let tier;
let level;
let browsingTier;
let givens;
let solution;
let current;
let selected;
let clockStart = null;
let saveAccount = '';

function gameStorageKey(key) {
  return saveAccount ? prefix + 'account:' + saveAccount + ':' + key.slice(prefix.length) : key;
}

function read(key) {
  try {
    const found = localStorage.getItem(gameStorageKey(key));
    return found ? JSON.parse(found) : null;
  } catch {
    return null;
  }
}

function write(key, value) {
  try {
    localStorage.setItem(gameStorageKey(key), JSON.stringify(value));
    storageFailed = false;
  } catch {
    storageFailed = true;
  }
  byId('save-status').dataset.failed = String(storageFailed);
  byId('save-label').textContent = storageFailed ? '当前浏览器无法保存' : '进度自动保存';
  if (!storageFailed) window.SudokuCloud?.queue(key);
}

function validTime(value) {
  return Number.isFinite(value) && value >= 0;
}

function validLevel(tier, level) {
  return difficulties.includes(tier) && Number.isInteger(level) && level >= 0 && level < levels[tier].length;
}

function startState(saved, clueDigits = givens, answerDigits = solution) {
  const values = clueDigits.map((n, i) => {
    const value = saved?.values?.[i];
    return n || (Number.isInteger(value) && value >= 0 && value <= 9 ? value : 0);
  });
  const notes = values.map((n, i) => {
    const mask = saved?.notes?.[i];
    return n || !Number.isInteger(mask) || mask < 0 || mask > 511 ? 0 : mask;
  });
  const history = Array.isArray(saved?.history) ? saved.history.slice(-150).filter(move =>
    Array.isArray(move) && move.length > 0 && move.every(change =>
      Array.isArray(change) && change.length === 3 && change.every(Number.isInteger) &&
      change[0] >= 0 && change[0] < 81 && !clueDigits[change[0]] &&
      change[1] >= 0 && change[1] <= 9 && change[2] >= 0 && change[2] <= 511
    )
  ) : [];
  const elapsed = validTime(saved?.elapsed) ? saved.elapsed : 0;
  const solved = values.every((n, i) => n === answerDigits[i]);
  return {
    values,
    notes,
    history,
    elapsed,
    started: saved?.started === true || solved,
    solved,
    best: validTime(saved?.best) ? saved.best : (solved ? elapsed : null),
    notesMode: saved?.notesMode === true,
    hints: Number.isInteger(saved?.hints) ? Math.min(3, Math.max(0, saved.hints)) : 0,
  };
}

function formatTime(time) {
  const seconds = Math.floor(time / 1000);
  return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
}

function elapsed() {
  return current.elapsed + (clockStart === null ? 0 : performance.now() - clockStart);
}

function resumeClock() {
  if (clockStart === null && current.started && !current.solved && !document.hidden) clockStart = performance.now();
}

function stopClock() {
  current.elapsed = elapsed();
  clockStart = null;
}

function currentSnapshot() {
  return { ...current, elapsed: elapsed(), selected };
}

function save() {
  write(levelKey(tier, level), currentSnapshot());
}

function showTime() {
  const display = formatTime(elapsed());
  if (timer.textContent !== display) timer.textContent = display;
}

function selectLevel(nextTier, nextLevel, persistPrevious = true) {
  if (current && persistPrevious) {
    stopClock();
    if (current.started || current.notesMode || current.best !== null) save();
  }
  tier = nextTier;
  level = nextLevel;
  browsingTier = nextTier;
  const [puzzle, answer] = levels[tier][level];
  givens = Array.from(puzzle, Number);
  solution = Array.from(answer, Number);
  restoreBoard();
  write(activeKey, { tier, level });
  byId('difficulty-pill').textContent = difficultyNames[tier];
  byId('game-title').textContent = '第 ' + numberLabel(level) + ' 关';
  render();
}

function restoreBoard() {
  const saved = read(levelKey(tier, level));
  clockStart = null;
  current = startState(saved);
  selected = Number.isInteger(saved?.selected) && saved.selected >= 0 && saved.selected < 81 ? saved.selected : -1;
  resumeClock();
}

function numberLabel(index) {
  return String(index + 1).padStart(2, '0');
}

const cells = [];
for (const rowNumber of digits) {
  const row = document.createElement('div');
  row.className = 'board-row';
  row.setAttribute('role', 'row');
  for (const colNumber of digits) {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    cell.setAttribute('role', 'gridcell');
    const i = (rowNumber - 1) * 9 + colNumber - 1;
    cell.addEventListener('click', () => selectCell(i));
    cell.addEventListener('focus', () => {
      if (cell.matches(':focus-visible') && i !== selected) selectCell(i);
    });
    row.append(cell);
    cells.push(cell);
  }
  board.append(row);
}

const padButtons = digits.map(n => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pad-key';
  btn.textContent = n;
  btn.addEventListener('click', () => enterNumber(n));
  pad.append(btn);
  return btn;
});

const tierButtons = difficulties.map(name => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'difficulty-tab';
  btn.textContent = difficultyNames[name];
  btn.addEventListener('click', () => {
    browsingTier = name;
    renderLevels();
  });
  difficultyTabs.append(btn);
  return btn;
});

const levelButtons = levels.easy.map((_, index) => {
  const btn = document.createElement('button');
  const status = document.createElement('span');
  btn.type = 'button';
  btn.className = 'level-button';
  btn.textContent = numberLabel(index);
  status.setAttribute('aria-hidden', 'true');
  btn.append(status);
  btn.addEventListener('click', () => {
    if (tier === browsingTier && level === index) return;
    selectLevel(browsingTier, index);
    if (matchMedia('(max-width: 800px)').matches) byId('game-title').scrollIntoView({ block: 'start', behavior: 'instant' });
  });
  levelGrid.append(btn);
  return { btn, status };
});

function renderBoard() {
  const mainTab = selected < 0 ? givens.indexOf(0) : selected;
  const selectedValue = current.values[selected];
  squares.forEach(i => {
    const cell = cells[i];
    const value = current.values[i];
    const noteDigits = value ? [] : digits.filter(n => current.notes[i] & bit(n));
    const conflict = value !== 0 && related[i].some(j => current.values[j] === value);
    cell.classList.toggle('given', givens[i] !== 0);
    cell.classList.toggle('selected', i === selected);
    cell.classList.toggle('related', selected >= 0 && related[selected].includes(i));
    cell.classList.toggle('match', i !== selected && value !== 0 && value === selectedValue);
    cell.classList.toggle('conflict', conflict);
    cell.tabIndex = i === mainTab ? 0 : -1;
    cell.setAttribute('aria-selected', String(i === selected));
    const label = value ? (givens[i] ? '题目数字 ' : '已填 ') + value : '空格';
    const notesLabel = noteDigits.length ? '，笔记 ' + noteDigits.join('、') : '';
    cell.setAttribute('aria-label', '第 ' + (rowOf(i) + 1) + ' 行第 ' + (colOf(i) + 1) + ' 列，' + label + notesLabel + (conflict ? '，数字重复' : ''));
    const content = value + ':' + noteDigits.join('');
    if (cell.dataset.content === content) return;
    cell.dataset.content = content;
    if (noteDigits.length) {
      const notes = document.createElement('span');
      notes.className = 'cell-notes';
      notes.setAttribute('aria-hidden', 'true');
      for (const n of digits) {
        const label = document.createElement('span');
        label.textContent = noteDigits.includes(n) ? n : '';
        notes.append(label);
      }
      cell.replaceChildren(notes);
    } else {
      cell.textContent = value || '';
    }
  });
}

function renderTools() {
  byId('undo').disabled = current.solved || !current.history.length;
  byId('erase').disabled = current.solved || selected < 0 || !!givens[selected] || (!current.values[selected] && !current.notes[selected]);
  byId('notes').disabled = current.solved;
  byId('notes').setAttribute('aria-pressed', String(current.notesMode));
  byId('hint').disabled = current.solved || current.hints >= 3;
  byId('hint').setAttribute('aria-label', '提示，还剩 ' + (3 - current.hints) + ' 次');
  byId('hint-count').textContent = 3 - current.hints;
  byId('mode-help').hidden = !current.notesMode || current.solved;
  for (const btn of padButtons) btn.disabled = current.solved;
}

function renderLevels() {
  tierButtons.forEach((btn, i) => btn.setAttribute('aria-pressed', String(difficulties[i] === browsingTier)));
  let completed = 0;
  levelButtons.forEach(({ btn, status }, index) => {
    const active = tier === browsingTier && level === index;
    const saved = active ? current : read(levelKey(browsingTier, index));
    const passed = validTime(saved?.best);
    const started = saved?.started === true;
    if (passed) completed++;
    btn.setAttribute('aria-current', String(active));
    btn.setAttribute('aria-label', difficultyNames[browsingTier] + '第 ' + (index + 1) + ' 关' + (passed ? '，已通关' : started ? '，有存档' : ''));
    status.className = passed ? 'level-status done' : 'level-status';
    status.textContent = passed ? '✓' : '';
    status.hidden = !passed && !started;
  });
  byId('tier-progress').textContent = completed + ' / ' + levelButtons.length + ' 已通关';
}

function render() {
  renderBoard();
  renderTools();
  renderLevels();
  showTime();
}

function selectCell(i, focus = false) {
  selected = i;
  renderBoard();
  renderTools();
  if (focus) cells[i].focus();
}

function notify(message) {
  const notice = byId('notice');
  clearTimeout(statusTimeout);
  notice.textContent = message;
  statusTimeout = setTimeout(() => { notice.textContent = ''; }, 2500);
}

function editableCell(i) {
  return !current.solved && i >= 0 && !givens[i];
}

function applyChanges(changes) {
  const previous = changes.map(([i]) => [i, current.values[i], current.notes[i]]);
  current.history.push(previous);
  if (current.history.length > 150) current.history.shift();
  for (const [i, value, notes] of changes) {
    current.values[i] = value;
    current.notes[i] = notes;
  }
  current.started = true;
  resumeClock();
  if (current.values.every((n, i) => n === solution[i])) {
    stopClock();
    current.solved = true;
    current.notesMode = false;
    current.best = Math.min(current.elapsed, current.best ?? Infinity);
    showWin();
  }
  save();
  render();
}

function placeNumber(i, n) {
  const changes = [[i, n, 0]];
  for (const j of related[i]) {
    if (current.notes[j] & bit(n)) changes.push([j, 0, current.notes[j] & ~bit(n)]);
  }
  applyChanges(changes);
}

function enterNumber(n) {
  if (current.solved) return;
  if (selected < 0) return notify('请先选择一个空格');
  if (!editableCell(selected)) return notify('题目给出的数字不能修改');
  if (current.notesMode) {
    if (current.values[selected]) return notify('请先擦除格子里的数字');
    applyChanges([[selected, 0, current.notes[selected] ^ bit(n)]]);
    return;
  }
  if (current.values[selected] !== n) placeNumber(selected, n);
}

function erase() {
  if (editableCell(selected) && (current.values[selected] || current.notes[selected])) applyChanges([[selected, 0, 0]]);
}

function undo() {
  if (current.solved || !current.history.length) return;
  const changes = current.history.pop();
  for (const [i, value, mask] of changes) {
    current.values[i] = value;
    current.notes[i] = mask;
  }
  selected = changes[0][0];
  save();
  render();
  if (board.contains(document.activeElement)) cells[selected].focus();
}

function toggleNotes() {
  if (current.solved) return;
  current.notesMode = !current.notesMode;
  save();
  renderTools();
}

function hint() {
  if (current.solved || current.hints >= 3) return;
  const i = editableCell(selected) && current.values[selected] !== solution[selected] ?
    selected : squares.find(index => current.values[index] !== solution[index]);
  if (i === undefined) return;
  selected = i;
  current.hints++;
  placeNumber(i, solution[i]);
}

function openDialog(title, paragraphs, options = {}) {
  byId('dialog-title').textContent = title;
  const content = byId('dialog-content');
  content.replaceChildren(...paragraphs.map(text => {
    const p = document.createElement('p');
    p.textContent = text;
    return p;
  }));
  const confirm = byId('dialog-confirm');
  confirm.hidden = !options.action;
  confirm.textContent = options.confirmText ?? '';
  byId('dialog-close').textContent = options.closeText ?? '关闭';
  dialogAction = options.action ?? null;
  if (!dialog.open) dialog.showModal();
}

function showWin() {
  const nextTier = level < levels[tier].length - 1 ? tier : difficulties[difficulties.indexOf(tier) + 1];
  const nextLevel = nextTier === tier ? level + 1 : 0;
  const options = nextTier ? { confirmText: '下一关', action: () => selectLevel(nextTier, nextLevel) } : {};
  options.closeText = '查看棋盘';
  const summary = '本关用时 ' + formatTime(current.elapsed) + '，最快纪录 ' + formatTime(current.best) + '。';
  openDialog('通关成功！', [summary], options);
}

byId('dialog-close').addEventListener('click', () => dialog.close());
byId('dialog-confirm').addEventListener('click', () => {
  const confirm = dialogAction;
  dialog.close();
  confirm?.();
});
dialog.addEventListener('close', () => { dialogAction = null; });

byId('undo').addEventListener('click', undo);
byId('erase').addEventListener('click', erase);
byId('notes').addEventListener('click', toggleNotes);
byId('hint').addEventListener('click', hint);

byId('restart').addEventListener('click', () => {
  if (!current.started && !current.notesMode) return notify('本关还没开始');
  openDialog('重开本关？', ['本关的填数、笔记和计时会清空，已获得的通关纪录会保留。'], {
    closeText: '继续游戏',
    confirmText: '重开本关',
    action: () => {
      clockStart = null;
      current = startState({ best: current.best });
      selected = -1;
      save();
      render();
    },
  });
});

byId('help').addEventListener('click', () => {
  openDialog('数独怎么玩', [
    '在每个空格填入 1–9，让每一行、每一列和每一个 3×3 方宫中的数字都不重复。',
    '点选空格后，使用下方数字键。打开笔记可记录多个候选数，再按同一个数字可以移除它。',
    '电脑上可以用方向键选格、数字键填数、N 切换笔记、Delete 擦除，以及 Ctrl 或 ⌘ + Z 撤销。',
  ]);
});

byId('jump-to-levels').addEventListener('click', () => {
  tierButtons[difficulties.indexOf(browsingTier)].focus({ preventScroll: true });
  byId('levels-title').scrollIntoView({ block: 'start' });
});

byId('share').hidden = location.protocol === 'file:';
byId('share').addEventListener('click', async () => {
  const url = new URL('.', location.href).href;
  if (navigator.share) {
    try {
      await navigator.share({ title: document.title, url });
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    notify('游戏链接已复制');
  } catch {
    openDialog('分享游戏', ['复制链接发给朋友。']);
    const input = document.createElement('input');
    input.readOnly = true;
    input.value = url;
    input.setAttribute('aria-label', '游戏链接');
    byId('dialog-content').append(input);
    input.focus();
    input.select();
  }
});

const arrowKeys = {
  ArrowLeft: [0, -1],
  ArrowRight: [0, 1],
  ArrowUp: [-1, 0],
  ArrowDown: [1, 0],
};
document.addEventListener('keydown', event => {
  if (dialog.open || event.altKey || event.target.matches('input, textarea, [contenteditable="true"]')) return;
  const key = event.key.toLowerCase();
  if (key === 'z' && (event.ctrlKey || event.metaKey) && !event.shiftKey) {
    event.preventDefault();
    undo();
    return;
  }
  if (event.ctrlKey || event.metaKey) return;
  if (/^[1-9]$/.test(key)) {
    event.preventDefault();
    enterNumber(Number(key));
  } else if (key === 'delete' || key === 'backspace') {
    event.preventDefault();
    erase();
  } else if (key === 'n') {
    event.preventDefault();
    if (!event.repeat) toggleNotes();
  } else if (arrowKeys[event.key] && (board.contains(event.target) || event.target === document.body)) {
    event.preventDefault();
    const [dy, dx] = arrowKeys[event.key];
    const i = selected < 0 ? givens.indexOf(0) : selected;
    const row = Math.max(0, Math.min(8, rowOf(i) + dy));
    const col = Math.max(0, Math.min(8, colOf(i) + dx));
    selectCell(selected < 0 ? i : row * 9 + col, true);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopClock();
    if (current.started && !current.solved) save();
  } else {
    resumeClock();
    showTime();
  }
});
window.addEventListener('pagehide', () => {
  if (clockStart !== null) {
    stopClock();
    save();
  }
});
window.addEventListener('pageshow', () => resumeClock());
window.addEventListener('storage', event => {
  if (event.key === gameStorageKey(levelKey(tier, level)) && event.newValue) {
    restoreBoard();
    render();
  } else if (event.key?.startsWith(gameStorageKey(prefix + browsingTier + ':'))) {
    renderLevels();
  }
});

function restoreGame() {
  const previous = read(activeKey);
  if (validLevel(previous?.tier, previous?.level)) {
    selectLevel(previous.tier, previous.level, false);
  } else {
    selectLevel('easy', 0, false);
  }
}

restoreGame();
setInterval(showTime, 250);

</script>
<script>
'use strict';

const saveFormat = 'sudoku-studio';
const saveVersion = 1;
const saveFileInput = byId('save-file');
const saveLimit = 2 * 1024 * 1024;

function hasBoardProgress(save) {
  return save?.started === true || save?.notesMode === true;
}

function levelSnapshot(targetTier, targetLevel) {
  return targetTier === tier && targetLevel === level
    ? currentSnapshot()
    : read(levelKey(targetTier, targetLevel));
}

function exportSaveData() {
  const entries = [];
  for (const name of difficulties) {
    levels[name].forEach(([puzzle], index) => {
      const save = levelSnapshot(name, index);
      if (hasBoardProgress(save) || validTime(save?.best)) {
        entries.push({ tier: name, level: index, puzzle, save });
      }
    });
  }
  return { format: saveFormat, version: saveVersion, active: { tier, level }, entries };
}

function downloadSave() {
  const backup = exportSaveData();
  if (!backup.entries.length) return notify('当前没有可导出的存档');
  const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'sudoku-studio-save.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  dialog.close();
  notify('存档已导出，可发送到另一台设备');
}

function parseSaveData(text) {
  const backup = JSON.parse(text);
  if (backup?.format !== saveFormat || backup.version !== saveVersion || !Array.isArray(backup.entries)) {
    throw new Error('请选取从数独练习室导出的存档文件');
  }
  if (!backup.entries.length || !validLevel(backup.active?.tier, backup.active?.level)) {
    throw new Error('存档文件里没有可恢复的进度');
  }

  const seen = new Set();
  const entries = backup.entries.map(entry => {
    const decoded = decodeSaveEntry(entry);
    if (seen.has(decoded.key)) throw new Error('存档包含重复关卡');
    seen.add(decoded.key);
    return decoded;
  });
  return { active: backup.active, entries };
}

function decodeSaveEntry(entry) {
  if (!validLevel(entry?.tier, entry?.level)) throw new Error('存档包含无法识别的关卡');
  const { tier: name, level: index, save } = entry;
  const [puzzle, answer] = levels[name][index];
  if (entry.puzzle !== puzzle) throw new Error('这份存档对应的题目版本与当前游戏不一致');
  if (!Array.isArray(save?.values) || save.values.length !== squares.length ||
      !Array.isArray(save.notes) || save.notes.length !== squares.length ||
      !validTime(save.elapsed)) {
    throw new Error('存档内容不完整或已损坏');
  }
  return {
    tier: name,
    level: index,
    key: levelKey(name, index),
    save: {
      ...startState(save, Array.from(puzzle, Number), Array.from(answer, Number)),
      selected: Number.isInteger(save.selected) && squares.includes(save.selected) ? save.selected : -1,
    },
  };
}

function sameBoardProgress(a, b) {
  return JSON.stringify(a.values) === JSON.stringify(b.values) &&
    JSON.stringify(a.notes) === JSON.stringify(b.notes) &&
    a.hints === b.hints;
}

function mergeSave(incoming, existing, useIncoming) {
  const selectedSave = !hasBoardProgress(existing) || (hasBoardProgress(incoming) && useIncoming)
    ? incoming : existing;
  const records = [incoming.best, existing?.best].filter(validTime);
  return { ...selectedSave, best: records.length ? Math.min(...records) : null };
}

function applyBackup(backup, useIncoming, announce = true) {
  const updates = new Map(backup.entries.map(entry => [
    entry.key,
    mergeSave(entry.save, levelSnapshot(entry.tier, entry.level), useIncoming),
  ]));
  const currentKey = levelKey(tier, level);
  const running = currentSnapshot();
  if (!updates.has(currentKey) && (hasBoardProgress(running) || validTime(running.best))) {
    updates.set(currentKey, running);
  }
  updates.set(activeKey, backup.active);

  const previousValues = new Map();
  try {
    for (const [key, value] of updates) {
      const target = gameStorageKey(key);
      const before = localStorage.getItem(target);
      localStorage.setItem(target, JSON.stringify(value));
      previousValues.set(target, before);
    }
  } catch {
    for (const [key, value] of previousValues) {
      try {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      } catch {
        // A browser may revoke storage access while the dialog is open.
      }
    }
    notify('导入失败，请检查浏览器是否允许站点保存数据');
    return false;
  }

  for (const key of updates.keys()) window.SudokuCloud?.queue(key);
  clockStart = null;
  selectLevel(backup.active.tier, backup.active.level, false);
  if (announce) notify('已导入 ' + backup.entries.length + ' 关存档');
  return true;
}

function previewBackup(backup) {
  const overlaps = backup.entries.filter(entry => {
    const existing = levelSnapshot(entry.tier, entry.level);
    return hasBoardProgress(entry.save) && hasBoardProgress(existing) && !sameBoardProgress(entry.save, existing);
  }).length;
  const message = ['找到 ' + backup.entries.length + ' 关存档。不同关卡的进度会合并，通关记录会保留更快的成绩。'];
  if (overlaps) message.push('其中 ' + overlaps + ' 关两边都玩过，选一下继续哪边的棋盘进度。');

  const field = document.createElement('fieldset');
  field.className = 'save-preference';
  const caption = document.createElement('legend');
  caption.textContent = '同一关的棋盘进度';
  field.append(caption);
  const input = {};
  for (const [value, text] of [['local', '继续此设备上的进度'], ['file', '从存档文件里的进度继续']]) {
    const label = document.createElement('label');
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'save-preference';
    radio.value = value;
    radio.checked = value === 'local';
    label.append(radio, text);
    field.append(label);
    input[value] = radio;
  }

  openDialog('导入存档', message, {
    closeText: '取消',
    confirmText: '确认导入',
    action: () => applyBackup(backup, input.file.checked),
  });
  if (overlaps) byId('dialog-content').append(field);
}

saveFileInput.addEventListener('change', async () => {
  const file = saveFileInput.files[0];
  saveFileInput.value = '';
  if (!file) return;
  try {
    if (file.size > saveLimit) throw new Error('这份存档文件过大，请检查是否选对文件');
    previewBackup(parseSaveData(await file.text()));
  } catch (error) {
    openDialog('无法导入存档', [error instanceof SyntaxError ? '这份文件无法读取，请选取数独练习室导出的 JSON 存档。' : error.message]);
  }
});

byId('manage-saves').addEventListener('click', () => {
  openDialog('存档管理', [
    '换设备时，在原设备导出存档文件，再用新设备打开游戏并导入。存档包含填数、笔记、用时和通关纪录。',
  ]);
  const actions = document.createElement('div');
  actions.className = 'save-actions';
  const download = document.createElement('button');
  download.type = 'button';
  download.className = 'button primary';
  download.textContent = '导出存档';
  download.addEventListener('click', downloadSave);
  const upload = document.createElement('button');
  upload.type = 'button';
  upload.className = 'button';
  upload.textContent = '导入存档';
  upload.addEventListener('click', () => saveFileInput.click());
  actions.append(download, upload);
  byId('dialog-content').append(actions);
});

</script>
<script>
window.SUDOKU_SYNC_URL = 'https://sudoku-studio-sync.jiangxiuteng125.workers.dev';

<script>
'use strict';

if (window.SUDOKU_SYNC_URL && location.protocol === 'https:') {
  (() => {
    const api = window.SUDOKU_SYNC_URL;
    const sessionKey = 'sudoku-studio:sync:v1:session';
    const recordKey = name => prefix + name;
    const accountButton = byId('cloud-account');
    const usernamePattern = /^[a-z0-9][a-z0-9_-]{2,23}$/;
    let session = readSession();
    let meta = getMeta();
    let task;
    let runTimer;
    let localRestoring = false;
    let syncError = '';
    let expired = false;

    function readSession() {
      try {
        const stored = JSON.parse(sessionStorage.getItem(sessionKey));
        return usernamePattern.test(stored?.username ?? '') && /^[a-f0-9]{64}$/.test(stored?.token ?? '') ? stored : null;
      } catch {
        return null;
      }
    }

    function rememberSession() {
      try {
        if (session) sessionStorage.setItem(sessionKey, JSON.stringify(session));
        else sessionStorage.removeItem(sessionKey);
      } catch {
        // The active page can still sync with its in-memory session.
      }
    }

    function metaKey() {
      return 'sudoku-studio:sync:v1:' + session?.username;
    }

    function getMeta() {
      const empty = { versions: {}, pending: {}, conflicts: {} };
      if (!session) return empty;
      try {
        return JSON.parse(localStorage.getItem(metaKey())) ?? empty;
      } catch {
        return empty;
      }
    }

    function storeMeta() {
      try {
        localStorage.setItem(metaKey(), JSON.stringify(meta));
      } catch {
        // Pending changes stay in memory during this session.
      }
    }

    function statusText() {
      if (expired) return '登录已过期，本机进度已保存';
      if (Object.keys(meta.conflicts).length) return '有存档冲突，点云存档处理';
      if (syncError) return '已存到本机，云端同步待重试';
      if (Object.keys(meta.pending).length) return '本机已保存，正在同步';
      return '云端已同步';
    }

    function renderStatus() {
      accountButton.textContent = session && !expired ? '账号' : '云存档';
      accountButton.dataset.attention = String(!!session && (expired || !!syncError || Object.keys(meta.conflicts).length > 0));
      accountButton.setAttribute('aria-label', session ? '云存档，' + statusText() : '云存档，注册或登录');
      if (session && !storageFailed) byId('save-label').textContent = statusText();
    }

    async function call(path, { method = 'GET', body, token, keepalive = false } = {}) {
      const headers = {};
      if (body) headers['Content-Type'] = 'application/json';
      if (token) headers.Authorization = 'Bearer ' + token;
      const response = await fetch(api + path, {
        method, headers, body, keepalive, cache: 'no-store', credentials: 'omit',
        signal: AbortSignal.timeout?.(10000),
      });
      const result = response.status === 204 ? {} : await response.json();
      if (!response.ok && response.status !== 409) {
        throw Object.assign(new Error(result.error || '暂时无法连接云存档'), { code: response.status });
      }
      return { ...result, status: response.status };
    }

    function markPending(key) {
      if (!session || !saveAccount || localRestoring) return;
      const name = key.slice(prefix.length);
      meta.pending[name] = true;
      storeMeta();
      renderStatus();
      schedule(false);
    }

    function schedule(pull = true, delay = 400) {
      if (!session || expired) return;
      clearTimeout(runTimer);
      runTimer = setTimeout(() => runSync(pull), delay);
    }

    function cloudRecord(name) {
      const value = read(recordKey(name));
      if (!value) return null;
      if (name === 'active') return value;
      const [nameTier, number] = name.split(':');
      return { puzzle: levels[nameTier][Number(number)][0], save: value };
    }

    function remoteRecord(name, data) {
      if (name === 'active') return validLevel(data?.tier, data?.level) ? data : null;
      const [nameTier, number] = name.split(':');
      const index = Number(number);
      if (!validLevel(nameTier, index)) return null;
      try {
        const entry = decodeSaveEntry({ tier: nameTier, level: index, puzzle: data?.puzzle, save: data?.save });
        return { puzzle: data.puzzle, save: entry.save };
      } catch {
        return null;
      }
    }

    function putLocal(name, payload) {
      const value = name === 'active' ? payload : payload.save;
      localStorage.setItem(gameStorageKey(recordKey(name)), JSON.stringify(value));
      if (name === tier + ':' + level) {
        restoreBoard();
        render();
      } else if (name !== 'active') {
        renderLevels();
      }
    }

    function ingest(name, version, source) {
      if (!source || version <= (meta.versions[name] ?? 0)) return;
      const remote = remoteRecord(name, JSON.parse(source));
      if (!remote) return;

      const local = cloudRecord(name);
      if (!meta.pending[name] || !local) {
        putLocal(name, remote);
        delete meta.pending[name];
        delete meta.conflicts[name];
      } else if (name !== 'active') {
        if (!sameBoardProgress(local.save, remote.save) ||
            local.save.started !== remote.save.started || local.save.notesMode !== remote.save.notesMode) {
          meta.conflicts[name] = { version, remote };
          return;
        }
        const save = mergeSave(remote.save, local.save, remote.save.elapsed > local.save.elapsed);
        putLocal(name, { puzzle: remote.puzzle, save });
        if (JSON.stringify(save) === JSON.stringify(remote.save)) delete meta.pending[name];
        delete meta.conflicts[name];
      }
      meta.versions[name] = version;
    }

    function runSync(pull = true) {
      if (!session || expired) return Promise.resolve(false);
      if (task) return task;
      const account = session;
      task = (async () => {
        try {
          if (pull) {
            const cloud = await call('/saves', { token: account.token });
            if (account !== session) return false;
            for (const entry of cloud.entries) ingest(entry.key, entry.version, entry.data);
            storeMeta();
          }

          for (const name of Object.keys(meta.pending)) {
            if (account !== session) return false;
            if (meta.conflicts[name]) continue;
            const data = cloudRecord(name);
            if (!data) {
              delete meta.pending[name];
              continue;
            }
            const version = meta.versions[name] ?? 0;
            const start = JSON.stringify(data);
            const saved = await call('/saves', {
              method: 'PUT', token: account.token,
              body: JSON.stringify({ key: name, version, data }),
              keepalive: document.hidden,
            });
            if (account !== session) return false;
            if (saved.status === 409) {
              if (saved.version) ingest(name, saved.version, saved.data);
              else delete meta.versions[name];
            } else {
              meta.versions[name] = saved.version;
              if (start === JSON.stringify(cloudRecord(name))) delete meta.pending[name];
            }
            storeMeta();
          }
          syncError = '';
          return true;
        } catch (error) {
          if (account === session) {
            expired = error.code === 401;
            syncError = error.message;
          }
          return false;
        } finally {
          task = undefined;
          renderStatus();
          if (!syncError && Object.keys(meta.pending).some(name => !meta.conflicts[name])) schedule(false);
        }
      })();
      return task;
    }

    function restoreAccountGame() {
      localRestoring = true;
      try {
        clockStart = null;
        restoreGame();
      } finally {
        localRestoring = false;
      }
    }

    async function openSession(nextSession, backup) {
      const previousAccount = saveAccount;
      if (hasBoardProgress(current) || validTime(current.best)) save();
      if (task) await task;
      session = nextSession;
      saveAccount = session.username;
      syncError = '';
      expired = false;
      meta = getMeta();
      rememberSession();

      const prior = read(activeKey);
      if (validLevel(prior?.tier, prior?.level)) restoreAccountGame();
      else {
        localRestoring = true;
        selectLevel('easy', 0, false);
        localRestoring = false;
      }

      const pulled = await runSync();
      if (pulled) {
        if (backup) applyBackup(backup, false, false);
        else restoreAccountGame();
        await runSync(false);
      }
      renderStatus();
      if (previousAccount !== saveAccount) {
        notify(pulled ? '已登录，云存档可以跨设备继续' : '已登录，云存档连接稍后重试');
      }
    }

    async function signOut() {
      if (hasBoardProgress(current) || validTime(current.best)) save();
      await runSync(false);
      try {
        await call('/logout', { method: 'POST', token: session.token });
      } catch {
        // The local session is still removed when the network is unavailable.
      }
      clearTimeout(runTimer);
      session = null;
      saveAccount = '';
      meta = getMeta();
      syncError = '';
      expired = false;
      rememberSession();
      dialog.close();
      restoreAccountGame();
      renderStatus();
      notify('已退出账号');
    }

    function resolveConflict(useCloud) {
      for (const [name, conflict] of Object.entries(meta.conflicts)) {
        const local = cloudRecord(name);
        const remote = conflict.remote;
        const save = mergeSave(remote.save, local?.save, useCloud);
        putLocal(name, { puzzle: remote.puzzle, save });
        meta.versions[name] = conflict.version;
        delete meta.conflicts[name];
        if (JSON.stringify(save) === JSON.stringify(remote.save)) delete meta.pending[name];
        else meta.pending[name] = true;
      }
      storeMeta();
      renderStatus();
      schedule(false, 0);
    }

    function actionButton(text, action, primary = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = primary ? 'button primary' : 'button';
      button.textContent = text;
      button.addEventListener('click', action);
      return button;
    }

    function openAccount() {
      if (!session || expired) {
        showAuth(false);
        return;
      }
      const conflicts = Object.keys(meta.conflicts).length;
      const text = ['已登录 ' + session.username + '。手机和电脑登录同一账号即可继续。', statusText()];
      if (conflicts) text.push(conflicts + ' 关在两台设备都有新进度。请选择要继续的棋盘，最快通关纪录会合并保留。');
      openDialog('云存档', text);
      const actions = document.createElement('div');
      actions.className = 'save-actions';
      if (conflicts) {
        actions.append(
          actionButton('使用这台设备的进度', () => { resolveConflict(false); dialog.close(); }, true),
          actionButton('使用云端进度', () => { resolveConflict(true); dialog.close(); }),
        );
      } else {
        actions.append(actionButton('立即同步', async () => {
          const updated = await runSync();
          dialog.close();
          notify(updated ? '已检查云存档' : statusText());
        }, true));
      }
      actions.append(actionButton('退出账号', signOut));
      byId('dialog-content').append(actions);
    }

    async function deriveCredential(username, password) {
      const encode = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', encode.encode(password), 'PBKDF2', false, ['deriveBits']);
      const salt = encode.encode('sudoku-studio:password:v1:' + location.origin + ':' + username);
      const derived = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 600000 }, key, 256);
      return Array.from(new Uint8Array(derived), byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function inputFor(labelText, attributes) {
      const label = document.createElement('label');
      label.textContent = labelText;
      const input = document.createElement('input');
      for (const [name, value] of Object.entries(attributes)) input.setAttribute(name, value);
      label.append(input);
      return { label, input };
    }

    function showAuth(register) {
      openDialog(register ? '注册数独账号' : '登录数独账号', [
        register ? '设置用户名和密码。'
          : '在手机和电脑上登录同一个数独账号，进度会自动同步。',
      ], { closeText: '取消' });

      const form = document.createElement('form');
      form.className = 'auth-form';
      form.noValidate = true;
      const name = inputFor('用户名', {
        name: 'username', type: 'text', autocomplete: 'username', required: '', maxlength: '24',
        autocapitalize: 'none', spellcheck: 'false', placeholder: '3–24 位字母、数字、下划线或短横线',
      });
      name.input.value = session?.username ?? '';
      const password = inputFor('密码', {
        name: 'password', type: 'password', autocomplete: register ? 'new-password' : 'current-password',
        required: '',
      });
      form.append(name.label, password.label);
      const repeat = inputFor('再次输入密码', {
        name: 'confirm', type: 'password', autocomplete: 'new-password', required: '',
      });
      if (register) form.append(repeat.label);

      const migrate = inputFor('把本机游客存档合并到这个账号', { name: 'migrate', type: 'checkbox' });
      migrate.label.prepend(migrate.input);
      migrate.label.className = 'auth-migrate';
      if (!saveAccount && exportSaveData().entries.length) form.append(migrate.label);

      const warning = document.createElement('p');
      warning.className = 'auth-error';
      warning.setAttribute('role', 'status');
      form.append(warning);

      const buttons = document.createElement('div');
      buttons.className = 'auth-buttons';
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.className = 'button primary';
      const submitText = register ? '注册并登录' : '登录';
      submit.textContent = submitText;
      const toggle = actionButton(register ? '已有账号，去登录' : '注册新账号', () => showAuth(!register));
      buttons.append(submit, toggle);
      form.append(buttons);

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const username = name.input.value.trim().toLowerCase();
        if (!usernamePattern.test(username)) {
          warning.textContent = username
            ? '用户名需为 3–24 位英文字母、数字、下划线或短横线，首位须为字母或数字'
            : '请填写用户名';
          name.input.focus();
          return;
        }
        if (!password.input.value) {
          warning.textContent = '请填写密码';
          password.input.focus();
          return;
        }
        if (register && password.input.value !== repeat.input.value) {
          warning.textContent = repeat.input.value ? '两次输入的密码不一致' : '请再次输入密码';
          repeat.input.focus();
          return;
        }

        submit.disabled = true;
        toggle.disabled = true;
        submit.textContent = register ? '正在注册…' : '正在登录…';
        warning.dataset.pending = '';
        warning.textContent = submit.textContent;
        try {
          const credential = await deriveCredential(username, password.input.value);
          const result = await call(register ? '/register' : '/login', {
            method: 'POST', body: JSON.stringify({ username, credential }),
          });
          if (!result.token) throw new Error(result.error || (register ? '暂时无法注册' : '暂时无法登录'));
          if (!dialog.open || !form.isConnected) return;
          let backup;
          if (!saveAccount && migrate.input.checked) {
            const local = exportSaveData();
            if (local.entries.length) backup = parseSaveData(JSON.stringify(local));
          }
          await openSession({ username: result.username, token: result.token }, backup);
          form.reset();
          if (form.isConnected) dialog.close();
        } catch (error) {
          warning.textContent = error.name === 'TimeoutError' || error.name === 'AbortError'
            ? '连接云存档超时，请重试'
            : error.code || error.name === 'Error' ? error.message : '无法连接云存档，请检查网络后重试';
        } finally {
          delete warning.dataset.pending;
          submit.textContent = submitText;
          submit.disabled = false;
          toggle.disabled = false;
        }
      });

      byId('dialog-content').append(form);
      name.input.focus();
    }

    window.SudokuCloud = { queue: markPending };
    accountButton.hidden = false;
    accountButton.addEventListener('click', openAccount);
    document.addEventListener('visibilitychange', () => schedule(!document.hidden, 0));
    window.addEventListener('focus', () => schedule(true, 0));
    window.addEventListener('online', () => schedule(true, 0));
    window.addEventListener('pagehide', () => { if (session && !expired) runSync(false); });
    setInterval(() => { if (!document.hidden) schedule(true, 0); }, 20000);
    if (session) openSession(session);
    else renderStatus();
  })();
}
